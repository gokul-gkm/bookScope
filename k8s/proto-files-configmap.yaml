# kubernetes/proto-files-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: proto-files-configmap
data:
  user.proto: |
    syntax = "proto3";
    package user;

    service UserService {
      rpc Register (RegisterRequest) returns (RegisterResponse);
      rpc Login (LoginRequest) returns (LoginResponse);
      rpc ViewProfile (ViewProfileRequest) returns (ViewProfileResponse);
    }

    message RegisterRequest {
      string username = 1;
      string email = 2;
      string password = 3;
    }

    message RegisterResponse {
      string message = 1;
    }

    message LoginRequest {
      string email = 1;
      string password = 2;
    }

    message LoginResponse {
      string token = 1;
      User user = 2;
    }

    message ViewProfileRequest {
      string userId = 1;
    }

    message ViewProfileResponse {
      User user = 1;
    }

    message User {
      string id = 1;
      string username = 2;
      string email = 3;
    }

  book.proto: |
    syntax = "proto3";
    package book;

    service BookService {
      rpc ViewAllBooks (Empty) returns (BooksResponse);
      rpc ViewBook (BookRequest) returns (BookResponse);
      rpc AddBook (NewBook) returns (BookResponse);
      rpc EditBook (Book) returns (BookResponse);
      rpc DeleteBook (BookRequest) returns (Empty);
    }

    message Empty {}

    message BookRequest {
      string id = 1;
    }

    message NewBook {
      string title = 1;
      string author = 2;
      string description = 3;
      int32 publishedYear = 4;
    }

    message Book {
      string id = 1;
      string title = 2;
      string author = 3;
      string description = 4;
      int32 publishedYear = 5;
    }

    message BooksResponse {
      repeated Book books = 1;
    }

    message BookResponse {
      Book book = 1;
    }

  review.proto: |
    syntax = "proto3";
    package review;

    service ReviewService {
      rpc ViewAllReviews (Empty) returns (ReviewsResponse);
      rpc ViewReview (ReviewRequest) returns (ReviewResponse);
      rpc AddReview (NewReview) returns (ReviewResponse);
      rpc EditReview (EditReview) returns (ReviewResponse);
      rpc DeleteReview (DeleteReviewRequest) returns (Empty);
      rpc GetReviewsByBookId(BookIdRequest) returns (ReviewsResponse);
    }

    message Empty {}

    message ReviewRequest {
      string id = 1;
    }

    message BookIdRequest { 
        string bookId = 1;
    }

    message DeleteReviewRequest {
      string id = 1;
      string userId = 2;
    }

    message NewReview {
      string bookId = 1;
      string userId = 2;
      int32 rating = 3;
      string comment = 4;
    }

    message EditReview {
      string id = 1;
      string bookId = 2;
      string userId = 3;
      int32 rating = 4;
      string comment = 5;
    }

    message Review {
      string id = 1;
      string bookId = 2;
      string userId = 3;
      int32 rating = 4;
      string comment = 5;
      string createdAt = 6;
      string updatedAt = 7;
    }

    message ReviewsResponse {
      repeated Review reviews = 1;
    }

    message ReviewResponse {
      Review review = 1;
    }
